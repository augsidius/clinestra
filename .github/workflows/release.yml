name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the tag matches the package version
        id: check
        run: |
          version=$(python -c "exec(open('src/clinestra/_version.py').read()); print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for the release to appear on TestPyPI
        run: |
          for i in $(seq 1 30); do
            curl -fs "https://test.pypi.org/pypi/clinestra/$VERSION/json" > /dev/null && exit 0
            sleep 10
          done
          exit 1
      # Only clinestra comes from TestPyPI; its dependencies come from PyPI, so squatted copies on TestPyPI are never used.
      - name: Download the release from TestPyPI
        run: pip download --no-deps --index-url https://test.pypi.org/simple/ "clinestra==$VERSION" -d pkg
      - name: Check the core install
        run: |
          python -m venv core
          core/bin/pip install pkg/clinestra-$VERSION-py3-none-any.whl
          core/bin/clinestra demo
      - name: Check the full install
        run: |
          python -m venv full
          full/bin/pip install "pkg/clinestra-$VERSION-py3-none-any.whl[full]"
          full/bin/clinestra demo
          full/bin/python -c "from clinestra import Harness; from clinestra.server import create_app, APIKeyAuth; create_app(Harness(), APIKeyAuth({}))"

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
